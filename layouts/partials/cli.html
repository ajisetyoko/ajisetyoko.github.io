<div class="vim-bar" id="vim-bar">
  <div class="vim-statusline">
    <span id="vim-mode">-- NORMAL --</span>
    <span id="vim-path">{{ .RelPermalink }}</span>
  </div>
  <div class="vim-cmdline">
    <span id="vim-message"></span>
    <input type="text" id="vim-input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="vim command input">
  </div>
</div>
